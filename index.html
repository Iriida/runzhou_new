<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>润州小茶童 · 互动故事</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css">
<style>
/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #e6ede0 radial-gradient(circle at 20% 30%, #eaf3e5 0%, #d4dcc8 100%);
  font-family: "LXGW WenKai", "霞鹜文楷", "标小篆", "KaiTi", "楷体", serif;
}
body { display: flex; align-items: center; justify-content: center; padding: 1rem; }

/* ---------- 舞台容器 ---------- */
.game-container {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 820px;
  height: 95vh;
  padding: 1.5rem 1.5rem 0;
  border-radius: 8px;
  overflow: hidden;
  background: #f6efe3 linear-gradient(135deg, #f6efe3 0%, #ece1cf 100%);
  background-size: cover;
  background-position: center;
  box-shadow:
    0 12px 40px rgba(60, 80, 50, .3),
    0 0 0 1px #b3c9a8 inset,
    0 0 0 3px #8aaa7a inset;
  transition: background-image .5s;
}
.mask {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: rgba(246, 239, 227, .1);
  border-radius: inherit;
  pointer-events: none;
}

/* ---------- 卷首 ---------- */
.cover-screen {
  position: absolute;
  inset: 0;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: #f3ede3 linear-gradient(145deg, #f6efe3 0%, #e2ebd8 100%);
  box-shadow: 0 0 0 1px #b3c9a8 inset, 0 0 0 3px #8aaa7a inset;
  opacity: 1;
  pointer-events: auto;
  transition: opacity .8s ease;
}
.cover-screen.fade-out { opacity: 0; pointer-events: none; }

.cover-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 80%;
  color: #3d5a35;
  text-align: center;
  animation: gentle-pulse 3s ease-in-out infinite;
}
.cover-title {
  margin-bottom: .2rem;
  font-family: "标小篆", "LXGW WenKai", serif;
  font-size: 3.5rem;
  letter-spacing: 8px;
  text-shadow: 2px 2px 0 #d4dcc8, 4px 4px 0 rgba(0, 0, 0, .04);
}
.cover-subtitle {
  margin-bottom: 2rem;
  font-size: 1.5rem;
  letter-spacing: 6px;
  color: #6a8f63;
  opacity: .85;
}
.cover-quote {
  display: inline-block;
  margin-bottom: 3rem;
  padding: .8rem 0;
  border-top: 1px solid #a3c6a0;
  border-bottom: 1px solid #a3c6a0;
  font-size: 1.2rem;
  font-style: italic;
  color: #5e7a56;
}
.cover-btn {
  padding: .8rem 3rem;
  border: 2px solid #7f9f7a;
  border-radius: 4rem;
  background: rgba(255, 255, 255, .4);
  box-shadow: 4px 4px 0 #7f9f7a;
  color: #3d5a35;
  font: inherit;
  font-size: 2rem;
  letter-spacing: 4px;
  cursor: pointer;
  backdrop-filter: blur(2px);
  transition: all .3s;
}
.cover-btn:hover {
  background: #7f9f7a;
  color: #f6efe3;
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 #5e7a56;
}
.cover-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #5e7a56; }

@keyframes gentle-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.02); }
}

/* ---------- 浮窗 ---------- */
.popup-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: rgba(40, 50, 30, .4);
}
.popup-overlay.active { display: flex; }

.popup-card {
  position: relative;
  max-width: 90%;
  max-height: 80%;
  margin: 1.5rem;
  padding: 1.5rem 2rem;
  overflow-y: auto;
  border: 1px solid #b3c9a8;
  border-left: 8px solid #7f9f7a;
  border-radius: 0 16px 16px 0;
  background: #f9f2e3;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color: #2d3d24;
  font-family: "霞鹜文楷", "KaiTi", serif;
  font-size: 1rem;
  animation: fade-in .3s ease;
}
.popup-card h3 {
  margin-bottom: .5rem;
  padding-bottom: .3rem;
  border-bottom: 2px dashed #b3c9a8;
  font-family: "标小篆", "LXGW WenKai", serif;
  font-size: 1.6rem;
  color: #5e7a56;
}
.popup-card .sub { margin-bottom: .6rem; }
.popup-card .section { margin-top: .8rem; }
.popup-card .close-icon {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 1.6rem;
  color: #7f9f7a;
  cursor: pointer;
  transition: .2s;
}
.popup-card .close-icon:hover { color: #4a6a42; transform: scale(1.2); }

@keyframes fade-in {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- 卷轴 ---------- */
#scrollOverlay {
  position: absolute;
  inset: 0;
  z-index: 250;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  border-radius: inherit;
  background: rgba(30, 40, 25, .5);
  backdrop-filter: blur(4px);
}
#scrollOverlay.active { display: flex; }

.scroll-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 92%;
  max-height: 85%;
  padding: 2.5rem 2rem 1.8rem;
  overflow-y: auto;
  border: 6px solid #b3c9a8;
  border-radius: 16px;
  background: #f5f7ed;
  box-shadow: 0 16px 48px rgba(0, 0, 0, .6);
  animation: fade-in .5s ease;
}
.scroll-title {
  margin-bottom: .8rem;
  font-family: "LXGW WenKai", "KaiTi", serif;
  font-size: 1.4rem;
  font-weight: bold;
  letter-spacing: 4px;
  color: #5e7a56;
}
.scroll-poem {
  display: inline-block;
  min-width: 100px;
  padding: .5rem 1rem;
  border-radius: 8px;
  background: rgba(255, 247, 235, .3);
  color: #1f2a1a;
  font-family: "标小篆", "LXGW WenKai", serif;
  font-size: 2.2rem;
  line-height: 2.8;
  letter-spacing: .2em;
  writing-mode: vertical-rl;
  white-space: pre-line;
  max-height: none;
  overflow-y: auto;
}
.scroll-close-btn {
  margin-top: 1.5rem;
  padding: .6rem 2.5rem;
  border: none;
  border-radius: 40px;
  background: #7f9f7a;
  box-shadow: 0 4px 8px rgba(0, 0, 0, .2);
  color: #f6efe3;
  font: inherit;
  font-size: 1.2rem;
  cursor: pointer;
  transition: .2s;
}
.scroll-close-btn:hover  { background: #5e7a56; transform: scale(1.02); }
.scroll-close-btn:active { transform: scale(.96); }

/* ---------- 尾声 ---------- */
#endingScreen {
  position: absolute;
  inset: 0;
  z-index: 280;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  border-radius: inherit;
  background: rgba(40, 50, 35, .65);
  backdrop-filter: blur(6px);
}
#endingScreen.active { display: flex; }

.ending-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 92%;
  max-height: 88%;
  padding: 2.8rem 2.8rem 2.2rem;
  overflow-y: auto;
  border: 4px solid #b3c9a8;
  border-radius: 20px;
  background: #f5f7ed;
  box-shadow: 0 20px 56px rgba(0, 0, 0, .7);
  color: #2d3d24;
  font-family: "霞鹜文楷", "KaiTi", serif;
  text-align: center;
  animation: fade-in .5s ease;
}
.ending-title {
  width: 100%;
  margin-bottom: 1.4rem;
  padding-bottom: .6rem;
  border-bottom: 2px dashed #b3c9a8;
  font-family: "标小篆", "LXGW WenKai", serif;
  font-size: 1.8rem;
  letter-spacing: 6px;
  color: #5e7a56;
}
.ending-body {
  width: 100%;
  max-width: 640px;
  font-size: 1.2rem;
  line-height: 2.2;
  text-align: left;
  white-space: pre-wrap;
}
.ending-body p { margin: .6em 0; text-indent: 2em; }

.ending-restart-btn {
  margin-top: 2rem;
  padding: .8rem 3.6rem;
  border: none;
  border-radius: 60px;
  background: #7f9f7a;
  box-shadow: 0 6px 16px rgba(60, 80, 50, .3);
  color: #f6efe3;
  font: inherit;
  font-size: 1.5rem;
  letter-spacing: 4px;
  cursor: pointer;
  transition: .25s;
}
.ending-restart-btn:hover {
  background: #5e7a56;
  transform: scale(1.03);
  box-shadow: 0 8px 20px rgba(60, 80, 50, .4);
}
.ending-restart-btn:active { transform: scale(.96); }

/* ---------- 角色立绘 ---------- */
.character-left,
.character-right {
  position: absolute;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 180px;
  pointer-events: none;
}
.character-left  { left: 10px; }
.character-right { right: 10px; }

.character-left img,
.character-right img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
  filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .15)) brightness(1.05);
}
.char-name {
  position: absolute;
  bottom: 0;
  padding: .2rem 1.2rem;
  border: 1px solid #a3c6a0;
  border-radius: 30px;
  background: rgba(60, 50, 40, .7);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
  color: #f6efe3;
  font-family: "霞鹜文楷", "KaiTi", serif;
  font-size: .9rem;
  white-space: nowrap;
  backdrop-filter: blur(2px);
}
.character-left  .char-name { left: 100%;  margin-left: 6px; }
.character-right .char-name { right: 100%; margin-right: 6px; }

/* ---------- 游戏内布局 ---------- */
.top-section { flex-shrink: 0; position: relative; z-index: 2; margin-bottom: .3rem; }

#gameTitle {
  display: inline-block;
  margin: 0 0 .1rem 1.2rem;
  padding-bottom: .1rem;
  border-bottom: 2px solid #a3c6a0;
  font-family: "标小篆", "LXGW WenKai", serif;
  font-size: 2rem;
  font-weight: normal;
  letter-spacing: 6px;
  color: #3d5a35;
  text-shadow: 1px 1px 0 #e4edd9;
}
.chapter-tag {
  margin: -.2rem 0 .3rem 1.2rem;
  font-size: 1rem;
  font-style: italic;
  letter-spacing: 3px;
  color: #6a8f63;
}

.mid-section {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  justify-content: center;
  margin: .3rem 0 .8rem;
  padding: 0 .8rem;
  overflow-y: auto;
  z-index: 2;
}
.options-area { display: flex; flex-direction: column; gap: .7rem; width: 100%; }

.option-btn {
  width: 100%;
  padding: .7rem 1.5rem;
  border: 1px solid #a3c6a0;
  border-radius: 40px;
  background: #f1f5e8;
  box-shadow: 3px 3px 0 #a3c6a0;
  color: #2d3d24;
  font-family: "霞鹜文楷", "KaiTi", serif;
  font-size: 1.1rem;
  text-align: left;
  cursor: pointer;
  transition: .15s;
}
.option-btn:hover {
  background: #e3f0da;
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 #a3c6a0;
}
.option-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 #a3c6a0;
}

.bottom-dialog {
  display: flex;
  flex-shrink: 0;
  flex-direction: column;
  max-height: 35vh;
  margin-top: .3rem;
  padding: .8rem 1.5rem .4rem;
  border: 1px solid #a3c6a0;
  border-radius: 24px 24px 0 0;
  background: rgba(248, 245, 235, .92);
  box-shadow: 0 -6px 16px rgba(70, 90, 60, .08);
  backdrop-filter: blur(2px);
  z-index: 2;
}
.story-area {
  flex: 1;
  min-height: 70px;
  max-height: 180px;
  margin-bottom: .3rem;
  overflow-y: auto;
  color: #2d2a22;
  font-family: "霞鹜文楷", "KaiTi", "楷体", serif;
  font-size: 1.1rem;
  line-height: 1.9;
  word-break: break-word;
  scrollbar-width: thin;
  scrollbar-color: #b3c9a8 #f1f5e8;
}
.story-area p { margin: .4em 0; text-indent: 2em; white-space: pre-wrap; }

.continue-btn {
  align-self: flex-end;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  margin-top: .1rem;
  border: none;
  background: transparent;
  color: #6a8f63;
  font-size: 2.4rem;
  line-height: 1;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, .1);
  cursor: pointer;
  user-select: none;
  transition: .2s;
}
.continue-btn:hover  { color: #3d6b3a; transform: scale(1.15); }
.continue-btn:active { transform: scale(.95); }
.continue-btn.hidden { display: none; }

.footer {
  display: flex;
  flex-shrink: 0;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  margin-top: .2rem;
  padding: .3rem .5rem;
  border-top: 1px solid #cadbc0;
  color: #4d6645;
  font-size: .9rem;
  z-index: 2;
}
.bgm-control,
.reset-btn {
  padding: .3rem 1rem;
  border: 1px solid #a3c6a0;
  border-radius: 30px;
  background: transparent;
  color: #4d6645;
  font-family: inherit;
  font-size: .9rem;
  cursor: pointer;
  transition: .2s;
}
.reset-btn { background: #dce8d0; box-shadow: 2px 2px 0 #a3c6a0; }
.reset-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.bgm-control:hover,
.reset-btn:hover { background: #c8dbb8; }

/* 选项的水波纹提示 */
.question-item {
  position: relative;
  padding: .6rem 1rem;
  border-radius: 16px;
  animation: water-ripple 2.8s ease-in-out infinite;
}
.question-item:nth-child(1) { animation-delay: 0s; }
.question-item:nth-child(2) { animation-delay: .9s; }
.question-item:nth-child(3) { animation-delay: 1.8s; }

@keyframes water-ripple {
  0% {
    background-color: rgba(127, 159, 122, 0);
    box-shadow: 0 0 0 0 rgba(127, 159, 122, .35),
                inset 0 0 0 0 rgba(127, 159, 122, 0);
  }
  50% {
    background-color: rgba(127, 159, 122, .18);
    box-shadow: 0 0 0 20px rgba(127, 159, 122, 0),
                inset 0 0 20px 4px rgba(127, 159, 122, .08);
  }
  100% {
    background-color: rgba(127, 159, 122, 0);
    box-shadow: 0 0 0 0 rgba(127, 159, 122, 0),
                inset 0 0 0 0 rgba(127, 159, 122, 0);
  }
}

/* ---------- 响应式 ---------- */
@media (max-width: 600px) {
  .game-container { height: 98vh; padding: .8rem .8rem 0; }
  .character-left, .character-right { width: 120px; }
  #gameTitle { font-size: 1.6rem; margin-left: .5rem; }
  .chapter-tag { margin-left: .5rem; font-size: .85rem; }
  .option-btn { padding: .5rem 1rem; font-size: 1rem; }
  .story-area { max-height: 140px; font-size: .95rem; }
  .scroll-panel { padding: 1.5rem 1rem; }
  .scroll-poem { font-size: 1.5rem; line-height: 2.4; max-height: 70vh; }
  .ending-panel { padding: 1.8rem 1.5rem 1.5rem; }
  .ending-body { font-size: 1rem; line-height: 2; }
  .ending-restart-btn { padding: .6rem 2.4rem; font-size: 1.2rem; }
  .cover-title { font-size: 2.5rem; }
  .cover-subtitle { font-size: 1.2rem; }
  .cover-quote { font-size: 1rem; }
  .cover-btn { padding: .6rem 2rem; font-size: 1.5rem; }

  .question-item { padding: .5rem .8rem; border-radius: 14px; }
  @keyframes water-ripple {
    0%   { box-shadow: 0 0 0 0 rgba(127, 159, 122, .35); }
    50%  { background-color: rgba(127, 159, 122, .2);
           box-shadow: 0 0 0 14px rgba(127, 159, 122, 0); }
    100% { box-shadow: 0 0 0 0 rgba(127, 159, 122, 0); }
  }
}

@media (min-width: 601px) and (max-width: 1000px) {
  .character-left, .character-right { width: 140px; }
  .story-area { font-size: 1rem; }
  .scroll-poem { font-size: 2rem; }
  .ending-body { font-size: 1.1rem; }
  .cover-title { font-size: 3rem; }
}
</style>
</head>

<body>
<div class="game-container" id="gameContainer">
  <div class="mask"></div>

  <!-- 卷首 -->
  <div class="cover-screen" id="coverScreen">
    <div class="cover-content">
      <div class="cover-title">润州小茶童</div>
      <div class="cover-subtitle">· 江南茶事 ·</div>
      <div class="cover-quote">「一江春水，半盏茶」</div>
      <button class="cover-btn" id="startGameBtn">启 卷</button>
    </div>
  </div>

  <!-- 背景音：src 由 JS 在加载时按 CDN 配置注入 -->
  <audio id="bgWind" loop preload="auto" style="display:none"></audio>

  <!-- 浮窗 -->
  <div class="popup-overlay" id="popupOverlay"></div>

  <!-- 卷轴 -->
  <div id="scrollOverlay">
    <div class="scroll-panel">
      <div class="scroll-title" id="scrollTitle"></div>
      <div class="scroll-poem" id="scrollPoem"></div>
      <button class="scroll-close-btn" id="scrollCloseBtn">继续</button>
    </div>
  </div>

  <!-- 尾声 -->
  <div id="endingScreen">
    <div class="ending-panel">
      <div class="ending-title" id="endingTitle">· 尾声 · 江声</div>
      <div class="ending-body" id="endingBody"></div>
      <button class="ending-restart-btn" id="endingRestartBtn">重头再来</button>
    </div>
  </div>

  <!-- 立绘 -->
  <div class="character-left" id="charLeft" style="display:none">
    <img id="charLeftImg" src="" alt="">
    <span class="char-name" id="charLeftName"></span>
  </div>
  <div class="character-right" id="charRight" style="display:none">
    <img id="charRightImg" src="" alt="">
    <span class="char-name" id="charRightName"></span>
  </div>

  <!-- 顶栏 -->
  <div class="top-section">
    <h1 id="gameTitle">润州小茶童</h1>
    <div class="chapter-tag" id="chapterTag">· 序 ·</div>
  </div>

  <!-- 选项区 -->
  <div class="mid-section">
    <div class="options-area" id="optionsContainer"></div>
  </div>

  <!-- 对话区 -->
  <div class="bottom-dialog">
    <div class="story-area" id="storyText"></div>
    <div class="continue-btn hidden" id="continueBtn">▶</div>
  </div>

  <!-- 状态栏 -->
  <div class="footer">
    <button class="reset-btn" id="autoPlayBtn">自动播放</button>
    <span class="bgm-control" id="bgmToggle">🔊 江风</span>
    <button class="reset-btn" id="resetBtn">重头再来</button>
  </div>
</div>

<script>
'use strict';

/* ================================================================
 * 0. CDN 配置
 * ================================================================
 * 你的 GitHub Pages：https://iriida.github.io/runzhou_new/
 * 对应 CDN 前缀已填入下方，无需再改。
 *
 * 如果资源加载失败，可将 @main 换成 @master 试试（取决于仓库默认分支）。
 * 本地调试时把 CDN_BASE 改成 '' 即可回退到相对路径。
 * ================================================================ */

const CDN_BASE = 'https://cdn.jsdelivr.net/gh/iriida/runzhou_new@main/';

/** 资源路径拼接：CDN_BASE 为空时直接用相对路径 */
const asset = p => CDN_BASE ? CDN_BASE + p : p;

/* ================================================================
 * 1. 数据层
 * ================================================================ */

const KNOWLEDGE = {
  yangxian: {
    title: '阳羡茶',
    content: '产于常州宜兴（古称阳羡），唐代即为贡茶，与陆羽《茶经》渊源深厚。苏轼晚年酷爱此茶，曾写诗"雪芽为我求阳羡"。阳羡茶是江南茶文化的代表，也是江南文人雅士生活方式的缩影。'
  },
  su_bei_gui: {
    title: '苏轼北归',
    content: '1100年六月，苏轼从海南儋州渡海北归，1101年五月到达润州。此时已64岁，身体衰弱，同年七月病逝于常州。苏轼一生与江南渊源深厚：在杭州修苏堤，在宜兴买田种橘，在常州终老——江南是他生命最后的归宿，也是他诗文中反复书写的精神故土。'
  },

/* ================================================================
 * 4. 资源预加载
 * ================================================================
 * 策略：
 *   - 优先：切换到新场景时，立刻预加载「下一个场景」的背景图、立绘、音频
 *   - 后台：游戏开始后延迟 2 秒，按顺序静默加载剩余所有资源
 *   - 用 requestIdleCallback 在浏览器空闲时加载，不阻塞主线程
 *   - 保留资源引用防止被 GC，避免缓存失效
 * ================================================================ */

const AUDIO_EXT_MAP = { wind: '.mp3' };

const preloader = {
  loaded: new Set(),
  running: false,
  keepAlive: [],   // 保留引用，防止资源对象被垃圾回收

  /** 加载单个资源（图片或音频），返回 Promise 便于排队 */
  load(url) {
    if (this.loaded.has(url)) return Promise.resolve();
    this.loaded.add(url);

    const isAudio = /\.(mp3|m4a|ogg|wav)$/i.test(url);

    return new Promise(resolve => {
      if (isAudio) {
        const audio = new Audio();
        audio.preload = 'auto';
        audio.oncanplaythrough = () => resolve();
        audio.onerror = () => resolve();
        audio.src = url;
        this.keepAlive.push(audio);
      } else {
        const img = new Image();
        img.onload = () => resolve();
        img.onerror = () => resolve();
        img.src = url;
        this.keepAlive.push(img);
      }
    });
  },

  /** 立即加载指定场景相关的所有资源（图片 + 音频 + 立绘） */
  loadScene(sceneId) {
    const scene = SCENES[sceneId];
    if (!scene) return;

    if (scene.bg) this.load(scene.bg);

    const ext = AUDIO_EXT_MAP[sceneId] || '.m4a';
    this.load(asset(`sounds/${sceneId}${ext}`));

    if (scene.leftChar  && CHARS[scene.leftChar])  this.load(CHARS[scene.leftChar].image);
    if (scene.rightChar && CHARS[scene.rightChar]) this.load(CHARS[scene.rightChar].image);
  },

  /** 收集所有资源 URL */
  collectAll() {
    const urls = new Set();

    // 立绘
    Object.values(CHARS).forEach(c => urls.add(c.image));

    // 背景
    Object.values(SCENES).forEach(s => { if (s.bg) urls.add(s.bg); });

    // 音频：每个场景一句 + 背景音 + 卷轴
    Object.keys(SCENES).forEach(id => {
      const ext = AUDIO_EXT_MAP[id] || '.m4a';
      urls.add(asset(`sounds/${id}${ext}`));
    });
    urls.add(asset('sounds/wind.mp3'));
    urls.add(asset('sounds/jinshan.m4a'));

    return [...urls];
  },

  /** 后台顺序加载全部资源 */
  startBackground() {
    if (this.running) return;
    this.running = true;

    const all = this.collectAll();
    let i = 0;

    const next = () => {
      if (i >= all.length) return;
      const url = all[i++];
      this.load(url).then(() => {
        // 空闲时继续下一个，避免卡顿
        if ('requestIdleCallback' in window) {
          requestIdleCallback(next, { timeout: 1500 });
        } else {
          setTimeout(next, 200);
        }
      });
    };

    next();
  }
};

/* ================================================================
 * 5. 音频播放
 * ================================================================ */

function stopAudio() {
  if (!state.audio) return;
  state.audio.pause();
  state.audio.currentTime = 0;
  state.audio = null;
}

function playAudio(id, onEnd) {
  stopAudio();
  const ext = AUDIO_EXT_MAP[id] || '.m4a';
  const audio = new Audio(asset(`sounds/${id}${ext}`));
  audio.preload = 'auto';

  const finish = () => {
    if (state.audio === audio) state.audio = null;
    if (onEnd) onEnd();
  };

  audio.onerror = () => {
    console.log(`音频不存在: sounds/${id}${ext}`);
    finish();
  };
  audio.onended = finish;

  audio.play().catch(err => {
    console.log('音频播放失败:', err);
    const retry = () => {
      ['click', 'touchstart', 'keydown'].forEach(evt =>
        document.removeEventListener(evt, retry)
      );
      if (state.audio === audio) {
        audio.play().catch(() => finish());
      }
    };
    ['click', 'touchstart', 'keydown'].forEach(evt =>
      document.addEventListener(evt, retry, { once: true, passive: true })
    );
  });

  state.audio = audio;
}

/* ================================================================
 * 6. 界面工具
 * ================================================================ */

function hideInteractions() {
  dom.options.style.display = 'none';
  dom.continueBtn.classList.add('hidden');
}

function restoreInteractions(scene) {
  if (scene.options && scene.options.length === 1) {
    dom.options.style.display = 'none';
    dom.continueBtn.classList.remove('hidden');
  } else {
    dom.options.style.display = 'flex';
    dom.continueBtn.classList.add('hidden');
  }
}

function alignCharacters() {
  const dialogRect = dom.bottomDialog.getBoundingClientRect();
  const containerRect = dom.container.getBoundingClientRect();
  const offset = containerRect.bottom - dialogRect.top + 'px';
  if (dom.charLeft.style.display !== 'none')  dom.charLeft.style.bottom = offset;
  if (dom.charRight.style.display !== 'none') dom.charRight.style.bottom = offset;
}

function updateCharacters(leftKey, rightKey) {
  const setSide = (side, key) => {
    const wrap = side === 'left' ? dom.charLeft : dom.charRight;
    const img  = side === 'left' ? dom.charLeftImg : dom.charRightImg;
    const name = side === 'left' ? dom.charLeftName : dom.charRightName;
    if (!key) { wrap.style.display = 'none'; return; }
    const char = CHARS[key];
    img.src = char.image;
    name.textContent = char.name;
    wrap.style.display = 'flex';
  };
  setSide('left', leftKey);
  setSide('right', rightKey);
}

function splitText(text) {
  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim() !== '');
  const html = paragraphs
    .map(p => `<p>${p.split('\n').filter(l => l.trim()).join('<br>')}</p>`)
    .join('');
  return { html: html || '<p></p>', paragraphs };
}

/* ================================================================
 * 7. 打字机
 * ================================================================ */

function stopTyping() {
  clearInterval(state.typeTimer);
  state.typeTimer = null;
  state.typing = false;
}

function typeText(elements, paragraphs, speed, onDone) {
  stopTyping();
  state.typing = true;
  elements.forEach(el => el.textContent = '');

  let paraIndex = 0;
  let charIndex = 0;

  state.typeTimer = setInterval(() => {
    if (paraIndex >= paragraphs.length) {
      stopTyping();
      onDone && onDone();
      return;
    }
    const el = elements[paraIndex];
    const text = paragraphs[paraIndex];

    if (charIndex < text.length) {
      el.textContent += text[charIndex++];
      dom.story.scrollTop = dom.story.scrollHeight;
    } else {
      paraIndex++;
      charIndex = 0;
    }
  }, speed);
}

function finishTyping() {
  if (!state.typing) return;
  stopTyping();
  dom.story.innerHTML = state.typedHtml;
}

/* ================================================================
 * 8. 浮窗
 * ================================================================ */

function showPopups(items, done) {
  if (!items.length) { done && done(); return; }

  const item = items.shift();
  const data = item.type === 'figure' ? FIGURES[item.id] : KNOWLEDGE[item.id];
  if (!data) { showPopups(items, done); return; }

  finishTyping();
  stopAudio();
  hideInteractions();

  const card = document.createElement('div');
  card.className = 'popup-card';

  let body = '<span class="close-icon">✕</span>';

  if (item.type === 'figure') {
    body += `<h3>${data.name} (${data.years})</h3>`;
    body += `<div class="sub">${data.desc}</div>`;
    if (data.book && data.book.length) {
      body += `<div class="section"><strong>书中记：</strong><br>${data.book.join('<br>')}</div>`;
    }
    body += `<div class="section"><strong>百姓说：</strong> ${data.folk}</div>`;
  } else {
    body += `<h3>${data.title}</h3><div>${data.content}</div>`;
  }

  card.innerHTML = body;
  dom.popupOverlay.innerHTML = '';
  dom.popupOverlay.appendChild(card);
  dom.popupOverlay.classList.add('active');

  const sceneAtOpen = state.sceneId;

  const close = () => {
    stopAudio();
    dom.popupOverlay.classList.remove('active');
    dom.popupOverlay.innerHTML = '';
    const scene = SCENES[sceneAtOpen];
    if (scene) restoreInteractions(scene);
    alignCharacters();
    showPopups(items, done);
  };

  card.querySelector('.close-icon').onclick = e => {
    e.stopPropagation();
    close();
  };
  dom.popupOverlay.onclick = e => {
    if (e.target === dom.popupOverlay) close();
  };

  playAudio(item.id, close);
}

/* ================================================================
 * 9. 卷轴
 * ================================================================ */

function showScroll(scene) {
  stopTyping();
  clearInterval(state.scrollTimer);
  hideInteractions();

  playAudio('jinshan', () => {});

  dom.scrollTitle.textContent = scene.chapter || '自题金山画像';
  dom.scrollPoem.textContent = '';
  dom.scrollCloseBtn.textContent = '继续';
  dom.scrollOverlay.classList.add('active');

  const chars = scene.scrollContent.split('');
  let i = 0;
  state.scrollTimer = setInterval(() => {
    if (i < chars.length) {
      dom.scrollPoem.textContent += chars[i++];
    } else {
      clearInterval(state.scrollTimer);
      state.scrollTimer = null;
    }
  }, 80);

  dom.scrollCloseBtn.onclick = () => {
    stopAudio();
    clearInterval(state.scrollTimer);
    state.scrollTimer = null;
    dom.scrollOverlay.classList.remove('active');
    if (scene.nextScene) displayScene(scene.nextScene);
  };
}

/* ================================================================
 * 10. 尾声
 * ================================================================ */

function showEnding(scene) {
  stopAudio();
  [dom.topSection, dom.midSection, dom.bottomDialog, dom.footer,
   dom.charLeft, dom.charRight, dom.mask].forEach(el => el.style.display = 'none');

  dom.endingTitle.textContent = scene.chapter || '· 尾声 ·';

  const { paragraphs } = splitText(scene.text);
  dom.endingBody.innerHTML = paragraphs
    .map(p => `<p>${p.split('\n').filter(l => l.trim()).join('<br>')}</p>`)
    .join('');

  dom.endingScreen.classList.add('active');
  dom.endingRestart.onclick = resetGame;
}

/* ================================================================
 * 11. 场景渲染
 * ================================================================ */

function maybeAutoContinue(scene) {
  if (!state.autoPlay) return;
  if (!scene.options || scene.options.length !== 1) return;
  setTimeout(() => {
    if (!dom.continueBtn.classList.contains('hidden')) dom.continueBtn.click();
  }, 500);
}

function renderOptions(scene) {
  dom.options.innerHTML = '';
  dom.continueBtn.classList.add('hidden');

  if (scene.type === 'scroll') return;

  if (scene.type === 'choice') {
    dom.options.style.display = 'flex';
    scene.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.text;
      btn.onclick = () => displayScene(scene.nextScene);
      dom.options.appendChild(btn);
    });
    return;
  }

  if (scene.type === 'input') {
    dom.options.style.display = 'flex';
    const wrap = document.createElement('div');
    wrap.style.width = '100%';

    const label = document.createElement('label');
    label.textContent = scene.inputLabel;
    label.style.display = 'block';
    label.style.marginBottom = '.5rem';

    const input = document.createElement('input');
    input.type = 'text';
    Object.assign(input.style, {
      width: '100%', padding: '.5rem',
      border: '1px solid #a3c6a0', borderRadius: '8px',
      background: '#fafff5', fontFamily: 'inherit'
    });

    const submit = document.createElement('button');
    submit.className = 'option-btn';
    submit.textContent = scene.submitLabel;
    submit.style.marginTop = '.8rem';
    submit.onclick = () => displayScene(scene.nextScene);

    wrap.append(label, input, submit);
    dom.options.appendChild(wrap);
    return;
  }

  if (scene.options && scene.options.length === 1) {
    dom.options.style.display = 'none';
    dom.continueBtn.classList.remove('hidden');
    dom.continueBtn.onclick = () => {
      if (state.typing) { finishTyping(); return; }
      displayScene(scene.options[0].nextScene);
    };
  } else if (scene.options && scene.options.length > 1) {
    dom.options.style.display = 'flex';
    scene.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.text;
      btn.onclick = () => displayScene(opt.nextScene);
      dom.options.appendChild(btn);
    });
  } else {
    dom.options.style.display = 'none';
  }
}

/** 主入口 */
function displayScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;

  state.sceneId = sceneId;
  stopAudio();
  stopTyping();
  clearInterval(state.scrollTimer);
  state.scrollTimer = null;

  // 结束场景
  if (scene.type === 'ending') {
    showEnding(scene);
    return;
  }

  // 从特殊界面返回
  if (dom.endingScreen.classList.contains('active')) {
    dom.endingScreen.classList.remove('active');
    dom.topSection.style.display = 'block';
    dom.midSection.style.display = 'flex';
    dom.bottomDialog.style.display = 'flex';
    dom.footer.style.display = 'flex';
    dom.mask.style.display = 'block';
  }
  if (dom.scrollOverlay.classList.contains('active')) {
    dom.scrollOverlay.classList.remove('active');
  }

  // 清浮窗
  dom.popupOverlay.classList.remove('active');
  dom.popupOverlay.innerHTML = '';

  // 背景与章节
  if (scene.bg) {
    dom.container.style.backgroundImage = `url('${scene.bg}')`;
    dom.container.style.backgroundColor = 'transparent';
  } else {
    dom.container.style.backgroundImage = 'none';
    dom.container.style.backgroundColor = '#f6efe3';
  }
  if (scene.chapter) dom.chapterTag.textContent = scene.chapter;

  // 立绘
  updateCharacters(scene.leftChar, scene.rightChar);
  setTimeout(alignCharacters, 50);

  // 卷轴场景
  if (scene.type === 'scroll') {
    dom.story.innerHTML = '';
    showScroll(scene);
    return;
  }

  // 正文
  const { html, paragraphs } = splitText(scene.text);
  state.typedHtml = html;
  dom.story.innerHTML = '';
  const elements = paragraphs.map(() => {
    const p = document.createElement('p');
    dom.story.appendChild(p);
    return p;
  });

  const popups = scene.popup
    ? (Array.isArray(scene.popup) ? scene.popup : [scene.popup])
    : [];

  // 立即开始播放场景音频（与打字动画同步进行，减少等待时间）
  playAudio(sceneId, () => maybeAutoContinue(scene));

  // 打字动画
  typeText(elements, paragraphs, 30, () => {
    // 打字结束后显示弹窗（如果有）
    if (popups.length) {
      showPopups(popups.slice(), () => {
        // 弹窗结束后重新播放场景音频
        playAudio(sceneId, () => maybeAutoContinue(scene));
      });
    }
  });

  // 选项区
  renderOptions(scene);
  if (popups.length) hideInteractions();

  /* ---------- 关键：预加载后续资源 ---------- */

  // 1. 优先预加载「下一个场景」的资源（玩家很快就要看到它）
  const nextId = scene.options && scene.options[0] && scene.options[0].nextScene;
  if (nextId) preloader.loadScene(nextId);

  // 2. 顺便把当前场景的浮窗涉及到的立绘也预加载（如果还没加载）
  popups.forEach(item => {
    if (item.type === 'figure') {
      const figKey = item.id;
      // 人物卡片没有独立图片资源，跳过
    }
  });
}

/* ================================================================
 * 12. 重置 / 事件绑定 / 初始化
 * ================================================================ */

function resetGame() {
  stopAudio();
  stopTyping();
  clearInterval(state.scrollTimer);
  state.scrollTimer = null;

  state.sceneId = 's1';
  state.autoPlay = false;
  state.bgmOn = false;
  state.typedHtml = '';

  dom.popupOverlay.classList.remove('active');
  dom.popupOverlay.innerHTML = '';
  dom.scrollOverlay.classList.remove('active');
  dom.endingScreen.classList.remove('active');

  dom.topSection.style.display = 'block';
  dom.midSection.style.display = 'flex';
  dom.bottomDialog.style.display = 'flex';
  dom.footer.style.display = 'flex';
  dom.mask.style.display = 'block';
  dom.charLeft.style.display = 'none';
  dom.charRight.style.display = 'none';

  dom.story.innerHTML = '';
  dom.options.innerHTML = '';
  dom.continueBtn.classList.add('hidden');
  dom.chapterTag.textContent = '· 序 ·';
  dom.container.style.backgroundImage = 'none';
  dom.container.style.backgroundColor = '#f6efe3';

  dom.autoPlayBtn.textContent = '自动播放';
  dom.bgmToggle.textContent = '🔊 江风';
  dom.bgWind.pause();
  dom.bgWind.currentTime = 0;

  dom.cover.style.display = 'flex';
  dom.cover.classList.remove('fade-out');
}

function bindEvents() {
  window.addEventListener('resize', alignCharacters);

  dom.startBtn.addEventListener('click', () => {
    if (!state.audioReady) {
      dom.bgWind.play()
        .then(() => { state.audioReady = true; state.bgmOn = true; })
        .catch(err => console.log('背景音播放失败:', err));
    }
    dom.cover.classList.add('fade-out');
    setTimeout(() => {
      dom.cover.style.display = 'none';
      displayScene('s1');

      // 游戏开始后延迟 2 秒启动后台全量预加载
      setTimeout(() => preloader.startBackground(), 2000);
    }, 800);
  });

  dom.bgmToggle.addEventListener('click', () => {
    state.bgmOn = !state.bgmOn;
    if (state.bgmOn) {
      dom.bgWind.play().catch(err => console.log('背景音播放失败:', err));
      dom.bgmToggle.textContent = '🔊 江风';
    } else {
      dom.bgWind.pause();
      dom.bgmToggle.textContent = '🔇 江风(静)';
    }
  });

  dom.autoPlayBtn.addEventListener('click', () => {
    state.autoPlay = !state.autoPlay;
    dom.autoPlayBtn.textContent = state.autoPlay ? '自动播放中' : '自动播放';
  });

  dom.resetBtn.addEventListener('click', resetGame);
}

window.addEventListener('load', () => {
  // 背景音 src 在这里注入，确保走 asset() 的 CDN 前缀
  dom.bgWind.src = asset('sounds/wind.mp3');
  dom.bgWind.load();

  dom.cover.style.display = 'flex';
  dom.cover.classList.remove('fade-out');
  bindEvents();
});
</script>
